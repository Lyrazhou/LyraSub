[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lyrasub"
version = "261015"
description = "弦字幕（LyraSub）— 面向影视字幕制作的本地时间轴转写工具"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<6.10",
  "faster-whisper>=1.1,<2.0",
  "av>=18,<19",
  "cryptography>=43,<46",
  "platformdirs>=4.3,<5.0",
  "requests>=2.32,<3.0",
  "opencc-python-reimplemented>=0.1.7,<0.2.0",
]

[project.optional-dependencies]
alignment = ["whisperx>=3.4,<4.0"]
dev = ["pytest>=8.3,<9.0", "ruff>=0.9,<1.0", "pyinstaller>=6.12,<7.0"]

[project.scripts]
lyrasub = "lyrasub.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
