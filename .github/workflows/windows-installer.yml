name: Windows x64 installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run tests and lint
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m pytest -q
          python -m ruff check src tests
          python -m ruff format --check src tests
      - name: Build frozen application directory
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $dist = Join-Path $root 'dist\LyraSub'
          $build = Join-Path $root 'build-win'
          $spec = Join-Path $root 'build-spec'
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'dist') | Out-Null
          python -m PyInstaller --noconfirm --clean --windowed --name LyraSub `
            --paths (Join-Path $root 'src') --distpath (Join-Path $root 'dist') `
            --workpath $build --specpath $spec --collect-all opencc `
            --exclude-module faster_whisper --exclude-module ctranslate2 `
            --exclude-module onnxruntime --exclude-module av --exclude-module tokenizers `
            --exclude-module huggingface_hub --exclude-module numpy `
            (Join-Path $root 'run_lyrasub.py')
          $runtime = Join-Path $dist '_internal'
          $env:LYRASUB_FROZEN_RUNTIME = $runtime
          @'
          import os
          import shutil
          import sysconfig
          from pathlib import Path

          site_packages = Path(sysconfig.get_paths()['purelib'])
          runtime = Path(os.environ['LYRASUB_FROZEN_RUNTIME'])
          packages = (
              'faster_whisper', 'ctranslate2', 'onnxruntime', 'av', 'tokenizers',
              'huggingface_hub', 'hf_xet', 'filelock', 'fsspec', 'tqdm', 'httpx', 'httpcore',
              'anyio', 'h11', 'click', 'numpy', 'yaml', 'typing_extensions', 'platformdirs',
              'packaging', 'opencc', 'numpy.libs', 'av.libs',
          )
          required = {'faster_whisper', 'ctranslate2', 'av', 'tokenizers'}
          for package in packages:
              source = site_packages / package
              if not source.exists():
                  if package in required:
                      raise SystemExit(f'Required source package missing: {source}')
                  continue
              destination = runtime / package
              shutil.copytree(source, destination, dirs_exist_ok=True)
              print(f'Copied {package}: {source} -> {destination}')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Failed to copy ASR runtime packages.' }
          if (-not (Test-Path (Join-Path $runtime 'opencc'))) {
            throw 'OpenCC is missing from the frozen application directory.'
          }
          $requiredAsrFiles = @(
            'faster_whisper\transcribe.py',
            'ctranslate2\_ext.cp312-win_amd64.pyd',
            'ctranslate2\ctranslate2.dll',
            'ctranslate2\cudnn64_9.dll',
            'ctranslate2\libiomp5md.dll',
            'av\__init__.py',
            'tokenizers\tokenizers.pyd'
          )
          foreach ($relativePath in $requiredAsrFiles) {
            $requiredFile = Join-Path $runtime $relativePath
            if (-not (Test-Path $requiredFile)) { throw "Required ASR runtime file missing: $relativePath" }
          }
          python -c "import sys; sys.path.insert(0, r'$runtime'); from opencc import OpenCC; assert OpenCC('t2s').convert('繁體中文測試') == '繁体中文测试'"
          @'
          {
            "product": "LyraSub",
            "display_name": "弦字幕 Plus（LyraSub Plus）",
            "version": "v261126A",
            "build_revision": 1,
            "baseline": false,
            "release_note": "LyraSub Plus：修复识别运行组件加载并增加安装后识别组件自检。",
            "update_channel": "stable",
            "models_location": "%LOCALAPPDATA%\\LyraSub\\models"
          }
          '@ | Set-Content -Encoding utf8 (Join-Path $dist 'release-manifest.json')
          $frozenApp = Join-Path $dist 'LyraSub.exe'
          $frozenDiagnostic = Join-Path $env:RUNNER_TEMP 'lyrasub-frozen-runtime-error.txt'
          Remove-Item $frozenDiagnostic -Force -ErrorAction SilentlyContinue
          $env:LYRASUB_RUNTIME_DIAGNOSTIC_FILE = $frozenDiagnostic
          $frozenCheck = Start-Process -FilePath $frozenApp -ArgumentList '--diagnose-recognition-runtime' -Wait -PassThru
          if ($frozenCheck.ExitCode -ne 0) {
            $details = if (Test-Path $frozenDiagnostic) { Get-Content $frozenDiagnostic -Raw } else { 'No diagnostic file was produced.' }
            throw "Frozen recognition runtime self-check failed with exit code $($frozenCheck.ExitCode): $details"
          }
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Build and validate installer
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $installer = Join-Path $root 'release\261126A_LyraSub-Plus-setup.exe'
          New-Item -ItemType Directory -Force -Path (Split-Path $installer) | Out-Null
          $makensisPath = (Get-Command 'makensis.exe' -ErrorAction SilentlyContinue).Source
          if (-not $makensisPath) {
            $nsisRoots = @(
              (Join-Path $env:ProgramFiles 'NSIS'),
              (Join-Path ${env:ProgramFiles(x86)} 'NSIS'),
              'C:\ProgramData\chocolatey\lib\nsis'
            )
            foreach ($nsisRoot in $nsisRoots) {
              if (Test-Path $nsisRoot) {
                $candidate = Get-ChildItem -Path $nsisRoot -Filter 'makensis.exe' -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($candidate) { $makensisPath = $candidate.FullName; break }
              }
            }
          }
          if (-not $makensisPath) { throw 'Could not locate makensis.exe after installing NSIS.' }
          Push-Location (Join-Path $root 'installer')
          & $makensisPath 'setup.nsi'
          $nsisExitCode = $LASTEXITCODE
          Pop-Location
          if ($nsisExitCode -ne 0) { throw 'NSIS installer build failed.' }
          if (-not (Test-Path $installer)) { throw 'NSIS did not create the expected installer.' }
          $bytes = [IO.File]::ReadAllBytes($installer)
          if ($bytes.Length -lt 1000000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            throw 'Installer is not a valid Windows PE executable or is unexpectedly small.'
          }
          $installDir = Join-Path $env:RUNNER_TEMP 'LyraSub-install-test'
          Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait
          $app = Join-Path $installDir 'LyraSub.exe'
          if (-not (Test-Path $app)) { throw 'Silent install did not create LyraSub.exe.' }
          $manifestPath = Join-Path $installDir 'release-manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.version -ne 'v261126A' -or $manifest.build_revision -ne 1) {
            throw 'Installed manifest version/revision mismatch.'
          }
          $installedDiagnostic = Join-Path $env:RUNNER_TEMP 'lyrasub-installed-runtime-error.txt'
          Remove-Item $installedDiagnostic -Force -ErrorAction SilentlyContinue
          $env:LYRASUB_RUNTIME_DIAGNOSTIC_FILE = $installedDiagnostic
          $runtimeCheck = Start-Process -FilePath $app -ArgumentList '--diagnose-recognition-runtime' -Wait -PassThru
          if ($runtimeCheck.ExitCode -ne 0) {
            $details = if (Test-Path $installedDiagnostic) { Get-Content $installedDiagnostic -Raw } else { 'No diagnostic file was produced.' }
            throw "Installed recognition runtime self-check failed with exit code $($runtimeCheck.ExitCode): $details The installer will not be uploaded."
          }
          $process = Start-Process -FilePath $app -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) { throw "Installed app exited during startup (code $($process.ExitCode))." }
          Stop-Process -Id $process.Id -Force
          Get-FileHash $installer -Algorithm SHA256 | Format-List
      - name: Upload temporary build artifact (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: v261126A-windows-x64-installer
          path: |
            release/261126A_LyraSub-Plus-setup.exe
            dist/LyraSub/release-manifest.json
          if-no-files-found: error
          retention-days: 14
